<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 羽球自學架拍偵測器 v6</title>
  
  <!-- 使用最安全、獨立無衝突的 MediaPipe 套件庫 -->
  <script src="https://cloudflare.com" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    h1 { margin: 5px 0; font-size: 1.3rem; color: #4caf50; }
    #dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      background: #2a2a35;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .data-box { text-align: center; font-size: 0.9rem; }
    .data-box span { display: block; font-size: 1.5rem; font-weight: bold; color: #ffeb3b; }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 360px; /* 固定容器高度，防止塌陷 */
      border-radius: 12px;
      overflow: hidden;
      background-color: #111;
    }
    #webcam { display: none; }
    #output_canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    #status-msg {
      margin: 5px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #ff5722;
    }
  </style>
</head>
<body>

  <h1>🏸 AI 羽球自學架拍偵測器 v6</h1>
  
  <div id="dashboard">
    <div class="data-box">正確次數<span id="score-val">0</span></div>
    <div class="data-box">左肘角度<span id="left-angle">-°</span></div>
    <div class="data-box">右肘角度<span id="right-angle">-°</span></div>
  </div>

  <div id="status-msg">正在初始化相機...</div>

  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <!-- 【修正】直接強行寫死畫布初始尺寸，絕對不允許 0 存在 -->
    <canvas id="output_canvas" width="480" height="360"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const scoreVal = document.getElementById('score-val');
    const leftAngleTxt = document.getElementById('left-angle');
    const rightAngleTxt = document.getElementById('right-angle');
    const statusMsg = document.getElementById('status-msg');

    let score = 0;
    let isCorrecting = false;
    let correctStartTime = null;
    const HOLD_TIME = 1000; 

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.3;
        window.speechSynthesis.speak(utterance);
      }
    }

    function calculateAngle(A, B, C) {
      const radians = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    function onResults(results) {
      statusMsg.innerText = "請面向鏡頭舉手架拍";
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        
        // 畫出基礎骨架
        ctxDrawLine(lm, lm); ctxDrawLine(lm, lm); 
        ctxDrawLine(lm, lm); ctxDrawLine(lm, lm); 
        ctxDrawLine(lm, lm); 

        const leftAngle = calculateAngle(lm, lm, lm);
        const rightAngle = calculateAngle(lm, lm, lm);

        leftAngleTxt.innerText = leftAngle + "°";
        rightAngleTxt.innerText = rightAngle + "°";

        const isLeftValid = (leftAngle >= 70 && leftAngle <= 115);
        const isRightValid = (rightAngle >= 70 && rightAngle <= 115);

        if (isRightValid && isLeftValid) {
          statusMsg.innerText = "姿勢正確！請維持住...";
          statusMsg.style.color = "#4caf50";

          if (!isCorrecting) {
            isCorrecting = true;
            correctStartTime = Date.now();
          } else {
            const duration = Date.now() - correctStartTime;
            if (duration >= HOLD_TIME) {
              score++;
              scoreVal.innerText = score;
              speak("架拍正確");
              isCorrecting = false; 
              correctStartTime = null;
            }
          }
        } else {
          isCorrecting = false;
          correctStartTime = null;
          statusMsg.style.color = "#ff5722";
        }
      }
      canvasCtx.restore();
    }

    function ctxDrawLine(pt1, pt2) {
      if(!pt1 || !pt2) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(pt1.x * canvasElement.width, pt1.y * canvasElement.height);
      canvasCtx.lineTo(pt2.x * canvasElement.width, pt2.y * canvasElement.height);
      canvasCtx.strokeStyle = '#00FF00';
      canvasCtx.lineWidth = 4;
      canvasCtx.stroke();
    }

    let pose;

    // 【核心優化】最純粹的鏡頭開啟語法，絕不進行任何尺寸動態偵測，不給 iOS 報錯的機會
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' }, 
          audio: false
        });
        videoElement.srcObject = stream;
        
        statusMsg.innerText = "相機連線成功，正在加載 AI 大腦...";
        initAI();
      } catch (err) {
        statusMsg.innerText = "相機硬體斷線，請關閉 Safari 分頁重試！";
        console.error(err);
      }
    }

    function initAI() {
      pose = new Pose({
        locateFile: (file) => `https://cloudflare.com{file}`
      });

      pose.setOptions({
        modelComplexity: 0, 
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      
      pose.onResults(onResults);

      // 【修正】直接開跑，不再等待 metadata 偵測，防止因 0 寬度導致 iOS 防火牆阻斷
      async function detectionLoop() {
        if (!videoElement.paused && !videoElement.ended && pose) {
          try {
            await pose.send({ image: videoElement });
          } catch(e) {}
        }
        requestAnimationFrame(detectionLoop);
      }
      detectionLoop();
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
