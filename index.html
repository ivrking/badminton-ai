<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 羽球自學架拍偵測器 v7</title>
  
  <!-- 改用手機相容性最高、內建自給自足大腦的 TensorFlow.js 骨架偵測套件 -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    h1 { margin: 5px 0; font-size: 1.3rem; color: #4caf50; }
    #dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      background: #2a2a35;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .data-box { text-align: center; font-size: 0.9rem; }
    .data-box span { display: block; font-size: 1.5rem; font-weight: bold; color: #ffeb3b; }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
    }
    #webcam { display: none; }
    #output_canvas {
      width: 100%;
      height: auto;
      transform: scaleX(-1);
      background-color: #111;
    }
    #status-msg {
      margin: 5px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #ff5722;
    }
  </style>
</head>
<body>

  <h1>🏸 AI 羽球自學架拍偵測器 v7</h1>
  
  <div id="dashboard">
    <div class="data-box">正確次數<span id="score-val">0</span></div>
    <div class="data-box">左肘角度<span id="left-angle">-°</span></div>
    <div class="data-box">右肘角度<span id="right-angle">-°</span></div>
  </div>

  <div id="status-msg">正在載入 AI 模型...</div>

  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas" width="480" height="360"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const scoreVal = document.getElementById('score-val');
    const leftAngleTxt = document.getElementById('left-angle');
    const rightAngleTxt = document.getElementById('right-angle');
    const statusMsg = document.getElementById('status-msg');

    let score = 0;
    let isCorrecting = false;
    let correctStartTime = null;
    const HOLD_TIME = 1000; 
    let detector;

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.3;
        window.speechSynthesis.speak(utterance);
      }
    }

    function calculateAngle(A, B, C) {
      const radians = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    // 將 17 個關鍵點陣列轉成可用物件
    function mapKeypoints(keypoints) {
      const map = {};
      keypoints.forEach(kp => {
        if (kp.score > 0.3) {
          map[kp.name] = { x: kp.x / canvasElement.width, y: kp.y / canvasElement.height };
        }
      });
      return map;
    }

    function drawLine(pt1, pt2) {
      if (!pt1 || !pt2) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(pt1.x * canvasElement.width, pt1.y * canvasElement.height);
      canvasCtx.lineTo(pt2.x * canvasElement.width, pt2.y * canvasElement.height);
      canvasCtx.strokeStyle = '#00FF00';
      canvasCtx.lineWidth = 4;
      canvasCtx.stroke();
    }

    async function detectionLoop() {
      if (videoElement.readyState >= 2 && detector) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

        const poses = await detector.estimatePoses(videoElement);

        if (poses && poses.length > 0) {
          statusMsg.innerText = "請面向鏡頭舉手架拍";
          const lm = mapKeypoints(poses[0].keypoints);

          // 畫出左右手骨架
          drawLine(lm['left_shoulder'], lm['left_elbow']);
          drawLine(lm['left_elbow'], lm['left_wrist']);
          drawLine(lm['right_shoulder'], lm['right_elbow']);
          drawLine(lm['right_elbow'], lm['right_wrist']);
          drawLine(lm['left_shoulder'], lm['right_shoulder']);

          if (lm['left_shoulder'] && lm['left_elbow'] && lm['left_wrist'] &&
              lm['right_shoulder'] && lm['right_elbow'] && lm['right_wrist']) {
              
            const leftAngle = calculateAngle(lm['left_shoulder'], lm['left_elbow'], lm['left_wrist']);
            const rightAngle = calculateAngle(lm['right_shoulder'], lm['right_elbow'], lm['right_wrist']);

            leftAngleTxt.innerText = leftAngle + "°";
            rightAngleTxt.innerText = rightAngle + "°";

            if (leftAngle >= 70 && leftAngle <= 115 && rightAngle >= 70 && rightAngle <= 115) {
              statusMsg.innerText = "姿勢正確！請維持住...";
              statusMsg.style.color = "#4caf50";

              if (!isCorrecting) {
                isCorrecting = true;
                correctStartTime = Date.now();
              } else {
                if (Date.now() - correctStartTime >= HOLD_TIME) {
                  score++;
                  scoreVal.innerText = score;
                  speak("架拍正確");
                  isCorrecting = false;
                  correctStartTime = null;
                }
              }
            } else {
              isCorrecting = false;
              correctStartTime = null;
              statusMsg.style.color = "#ff5722";
            }
          }
        }
        canvasCtx.restore();
      }
      requestAnimationFrame(detectionLoop);
    }

    async function main() {
      try {
        // 第一步：初始化不受網域限制的 MoveNet 模型
        detector = await poseDetection.createDetector(
          poseDetection.SupportedModels.MoveNet,
          { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
        );
        
        statusMsg.innerText = "模型載入成功！正在開啟鏡頭...";

        // 第二步：向 Safari 索取鏡頭
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 480, height: 360 },
          audio: false
        });
        videoElement.srcObject = stream;
        
        videoElement.onloadedmetadata = () => {
          statusMsg.innerText = "系統就緒！請往後退";
          detectionLoop();
        };
      } catch (err) {
        statusMsg.innerText = "初始化失敗，請重新載入網頁！";
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', main);
  </script>
</body>
</html>
