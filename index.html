<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 羽球自學架拍偵測器 v14</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    h1 { margin: 5px 0; font-size: 1.3rem; color: #4caf50; }
    #dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      background: #2a2a35;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .data-box { text-align: center; font-size: 1rem; }
    .data-box span { display: block; font-size: 1.8rem; font-weight: bold; color: #ffeb3b; }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
      background-color: #111;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    #webcam {
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 鏡像翻轉 */
      display: block;
    }
    #overlay_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }
    #status-msg {
      margin: 5px 0;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffeb3b;
    }
  </style>
</head>
<body>

  <h1>🏸 AI 羽球自學架拍偵測器 v14</h1>
  
  <div id="dashboard">
    <div class="data-box">正確次數<span id="score-val">0</span></div>
  </div>

  <div id="status-msg">正在啟動感應鏡頭...</div>

  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay_canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('overlay_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const statusMsg = document.getElementById('status-msg');

    let score = 0;
    let isZone1Filled = false;
    let isZone2Filled = false;
    let correctStartTime = null;
    let isCorrecting = false;
    const HOLD_TIME = 1000; // 維持 1 秒

    // 瀏覽器影像快照（用來做像素動態動態比對）
    let lastFramePixels = null;

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.3;
        window.speechSynthesis.speak(utterance);
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        videoElement.srcObject = stream;
        
        videoElement.onloadedmetadata = () => {
          canvasElement.width = videoElement.videoWidth;
          canvasElement.height = videoElement.videoHeight;
          statusMsg.innerText = "請退後，將雙手肘填滿兩個綠色感應框！";
          statusMsg.style.color = "#4caf50";
          speak("系統已就緒");
          processFrame();
        };
      } catch (err) {
        statusMsg.innerText = "鏡頭啟動失敗，請刷新重試！";
        console.error(err);
      }
    }

    function processFrame() {
      if (videoElement.readyState >= 2) {
        // 1. 建立一個隱藏的臨時畫布來抓取目前鏡頭的像素點
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvasElement.width;
        tempCanvas.height = canvasElement.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(videoElement, 0, 0, tempCanvas.width, tempCanvas.height);
        
        const currentFrameData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const pixels = currentFrameData.data;

        // 2. 清空主畫面疊加層
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        // 3. 定義正手架拍時，左右手肘應該要在的兩個「幾何感應框」位置（寬度 80, 高度 80）
        const zoneW = 80;
        const zoneH = 80;
        
        // 左手肘感應框位置 (畫面左側偏上)
        const zone1 = { x: 50, y: Math.floor(canvasElement.height * 0.3) };
        // 右手肘感應框位置 (畫面右側偏上)
        const zone2 = { x: canvasElement.width - 50 - zoneW, y: Math.floor(canvasElement.height * 0.3) };

        // 4. 計算感應框內的動態變化率（像素差值演算法）
        let zone1Changes = 0;
        let zone2Changes = 0;

        if (lastFramePixels) {
          // 檢查 Zone 1
          for (let y = zone1.y; y < zone1.y + zoneH; y++) {
            for (let x = zone1.x; x < zone1.x + zoneW; x++) {
              const idx = (y * canvasElement.width + x) * 4;
              const diff = Math.abs(pixels[idx] - lastFramePixels[idx]); // 紅色通道差值
              if (diff > 25) zone1Changes++;
            }
          }
          // 檢查 Zone 2
          for (let y = zone2.y; y < zone2.y + zoneH; y++) {
            for (let x = zone2.x; x < zone2.x + zoneW; x++) {
              const idx = (y * canvasElement.width + x) * 4;
              const diff = Math.abs(pixels[idx] - lastFramePixels[idx]);
              if (diff > 25) zone2Changes++;
            }
          }
        }

        // 保存當前影格像素
        lastFramePixels = pixels;

        // 當格子裡有物體（你的手臂）移入並定格（動態變化率在 5% 到 30% 之間穩定時）
        const z1Filled = zone1Changes > 150 && zone1Changes < 1500;
        const z2Filled = zone2Changes > 150 && zone2Changes < 1500;

        // 5. 在畫面上繪製半透明引導框
        canvasCtx.lineWidth = 4;
        
        // 畫左框
        canvasCtx.strokeStyle = z1Filled ? '#00FF00' : 'rgba(255, 0, 0, 0.5)';
        canvasCtx.fillStyle = z1Filled ? 'rgba(0, 255, 0, 0.2)' : 'rgba(255, 0, 0, 0.1)';
        canvasCtx.fillRect(zone1.x, zone1.y, zoneW, zoneH);
        canvasCtx.strokeRect(zone1.x, zone1.y, zoneW, zoneH);

        // 畫右框
        canvasCtx.strokeStyle = z2Filled ? '#00FF00' : 'rgba(255, 0, 0, 0.5)';
        canvasCtx.fillStyle = z2Filled ? 'rgba(0, 255, 0, 0.2)' : 'rgba(255, 0, 0, 0.1)';
        canvasCtx.fillRect(zone2.x, zone2.y, zoneW, zoneH);
        canvasCtx.strokeRect(zone2.x, zone2.y, zoneW, zoneH);

        // 6. 架拍定格秒數計時邏輯
        if (z1Filled && z2Filled) {
          statusMsg.innerText = "🔥 對準了！請保持定格 1 秒 🔥";
          statusMsg.style.color = "#00FF00";

          if (!isCorrecting) {
            isCorrecting = true;
            correctStartTime = Date.now();
          } else {
            if (Date.now() - correctStartTime >= HOLD_TIME) {
              score++;
              scoreVal.innerText = score;
              speak("架拍正確");
              isCorrecting = false;
              correctStartTime = null;
            }
          }
        } else {
          isCorrecting = false;
          correctStartTime = null;
          statusMsg.innerText = "請後退，將雙手肘放入綠色感應框中";
          statusMsg.style.color = "#ffeb3b";
        }
      }
      requestAnimationFrame(processFrame);
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
