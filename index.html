<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 羽球自學架拍偵測器 v3</title>
  
  <!-- 引入最穩定的 MediaPipe 骨架偵測核心 -->
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    h1 { margin: 5px 0; font-size: 1.3rem; color: #4caf50; }
    #dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      background: #2a2a35;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .data-box { text-align: center; font-size: 0.9rem; }
    .data-box span { display: block; font-size: 1.5rem; font-weight: bold; color: #ffeb3b; }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
    }
    #webcam { display: none; }
    #output_canvas {
      width: 100%;
      height: auto;
      transform: scaleX(-1);
      background-color: #111;
    }
    #status-msg {
      margin: 5px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #ff5722;
    }
  </script>
</head>
<body>

  <h1>🏸 AI 羽球自學架拍偵測器 v3</h1>
  
  <div id="dashboard">
    <div class="data-box">正確次數<span id="score-val">0</span></div>
    <div class="data-box">左肘角度<span id="left-angle">-°</span></div>
    <div class="data-box">右肘角度<span id="right-angle">-°</span></div>
  </div>

  <div id="status-msg">正在要求相機權限...</div>

  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas" width="480" height="360"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const scoreVal = document.getElementById('score-val');
    const leftAngleTxt = document.getElementById('left-angle');
    const rightAngleTxt = document.getElementById('right-angle');
    const statusMsg = document.getElementById('status-msg');

    let score = 0;
    let isCorrecting = false;
    let correctStartTime = null;
    const HOLD_TIME = 1000; 

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.3;
        window.speechSynthesis.speak(utterance);
      }
    }

    function calculateAngle(A, B, C) {
      const radians = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    function onResults(results) {
      statusMsg.innerText = "請面向鏡頭舉手架拍";
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 3 });
        drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#FF0000', lineWidth: 1, radius: 3 });

        const leftShoulder = results.poseLandmarks[11];
        const rightShoulder = results.poseLandmarks[12];
        const leftElbow = results.poseLandmarks[13];
        const rightElbow = results.poseLandmarks[14];
        const leftWrist = results.poseLandmarks[15];
        const rightWrist = results.poseLandmarks[16];

        if(leftShoulder && leftElbow && leftWrist && rightShoulder && rightElbow && rightWrist) {
          const leftAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
          const rightAngle = calculateAngle(rightShoulder, rightElbow, rightWrist);

          leftAngleTxt.innerText = leftAngle + "°";
          rightAngleTxt.innerText = rightAngle + "°";

          const isLeftValid = (leftAngle >= 70 && leftAngle <= 115);
          const isRightValid = (rightAngle >= 70 && rightAngle <= 115);

          if (isRightValid && isLeftValid) {
            statusMsg.innerText = "姿勢正確！請維持住...";
            statusMsg.style.color = "#4caf50";

            if (!isCorrecting) {
              isCorrecting = true;
              correctStartTime = Date.now();
            } else {
              const duration = Date.now() - correctStartTime;
              if (duration >= HOLD_TIME) {
                score++;
                scoreVal.innerText = score;
                speak("架拍正確");
                isCorrecting = false; 
                correctStartTime = null;
              }
            }
          } else {
            isCorrecting = false;
            correctStartTime = null;
            statusMsg.style.color = "#ff5722";
          }
        }
      }
      canvasCtx.restore();
    }

    // 先宣告變數，不急著在最一開始初始化模型
    let pose;

    // 【終極修正】第一步：網頁載入後，100% 先行強迫呼叫相機權限
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 480, height: 360 },
          audio: false
        });
        videoElement.srcObject = stream;
        
        // 相機成功開啟後，第二步：才在背景默默啟動 AI 模型
        statusMsg.innerText = "相機已啟動，正在載入 AI 骨架模型...";
        initAI();
      } catch (err) {
        statusMsg.innerText = "相機要求被拒絕，請清除瀏覽器權限紀錄再試！";
        console.error(err);
      }
    }

    // 第三步：模型載入完成後，開跑偵測迴圈
    function initAI() {
      pose = new Pose({
        locateFile: (file) => `https://jsdelivr.net{file}`
      });

      pose.setOptions({
        modelComplexity: 0, 
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      
      pose.onResults(onResults);

      videoElement.onloadedmetadata = () => {
        async function detectionLoop() {
          if (!videoElement.paused && !videoElement.ended && pose) {
            await pose.send({ image: videoElement });
          }
          requestAnimationFrame(detectionLoop);
        }
        detectionLoop();
      };
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
