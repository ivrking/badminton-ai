<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 羽球自學架拍偵測器 v2</title>
  
  <!-- 引入 Google MediaPipe 核心與姿態識別（移除不穩定的相機工具） -->
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    h1 { margin: 5px 0; font-size: 1.3rem; color: #4caf50; }
    #dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      background: #2a2a35;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .data-box { text-align: center; font-size: 0.9rem; }
    .data-box span { display: block; font-size: 1.5rem; font-weight: bold; color: #ffeb3b; }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
    }
    #webcam { display: none; }
    #output_canvas {
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 鏡像翻轉，像照鏡子 */
      background-color: #111;
    }
    #status-msg {
      margin: 5px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #ff5722;
    }
  </style>
</head>
<body>

  <h1>🏸 AI 羽球自學架拍偵測器 v2</h1>
  
  <div id="dashboard">
    <div class="data-box">正確次數<span id="score-val">0</span></div>
    <div class="data-box">左肘角度<span id="left-angle">-°</span></div>
    <div class="data-box">右肘角度<span id="right-angle">-°</span></div>
  </div>

  <div id="status-msg">正在要求相機權限...</div>

  <div id="video-container">
    <!-- 加入 playsinline, muted, autoplay 是防止 iOS 黑屏與禁止播放的關鍵 -->
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas" width="480" height="360"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const scoreVal = document.getElementById('score-val');
    const leftAngleTxt = document.getElementById('left-angle');
    const rightAngleTxt = document.getElementById('right-angle');
    const statusMsg = document.getElementById('status-msg');

    let score = 0;
    let isCorrecting = false;
    let correctStartTime = null;
    const HOLD_TIME = 1000; 

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.3;
        window.speechSynthesis.speak(utterance);
      }
    }

    function calculateAngle(A, B, C) {
      const radians = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    function onResults(results) {
      statusMsg.innerText = "請面向鏡鏡舉手架拍";
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 3 });
        drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#FF0000', lineWidth: 1, radius: 3 });

        const leftShoulder = results.poseLandmarks[11];
        const rightShoulder = results.poseLandmarks[12];
        const leftElbow = results.poseLandmarks[13];
        const rightElbow = results.poseLandmarks[14];
        const leftWrist = results.poseLandmarks[15];
        const rightWrist = results.poseLandmarks[16];

        const leftAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
        const rightAngle = calculateAngle(rightShoulder, rightElbow, rightWrist);

        leftAngleTxt.innerText = leftAngle + "°";
        rightAngleTxt.innerText = rightAngle + "°";

        // 架拍寬鬆標準設定在 70° ~ 115°
        const isLeftValid = (leftAngle >= 70 && leftAngle <= 115);
        const isRightValid = (rightAngle >= 70 && rightAngle <= 115);

        if (isRightValid && isLeftValid) {
          statusMsg.innerText = "姿勢正確！請維持住...";
          statusMsg.style.color = "#4caf50";

          if (!isCorrecting) {
            isCorrecting = true;
            correctStartTime = Date.now();
          } else {
            const duration = Date.now() - correctStartTime;
            if (duration >= HOLD_TIME) {
              score++;
              scoreVal.innerText = score;
              speak("架拍正確");
              isCorrecting = false; 
              correctStartTime = null;
            }
          }
        } else {
          isCorrecting = false;
          correctStartTime = null;
          statusMsg.style.color = "#ff5722";
        }
      }
      canvasCtx.restore();
    }

    // 初始化 MediaPipe Pose 模型
    const pose = new Pose({
      locateFile: (file) => `https://jsdelivr.net{file}`
    });

    pose.setOptions({
      modelComplexity: 0, // 改用 0 (速度最快，專為手機優化，防止黑屏卡死)
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    pose.onResults(onResults);

    // 【核心修正】使用原生網頁語法呼叫相機，100% 觸發手機瀏覽器權限彈窗
    async function startCamera() {
      try {
        const constraints = {
          video: {
            facingMode: 'user', // 強制使用前鏡頭
            width: { ideal: 480 },
            height: { ideal: 360 }
          },
          audio: false
        };
        
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = stream;
        
        // 當影片開播時，持續把畫面丟給 AI 運算
        videoElement.onloadedmetadata = () => {
          statusMsg.innerText = "AI 模型載入中...";
          async function detectionLoop() {
            if (!videoElement.paused && !videoElement.ended) {
              await pose.send({ image: videoElement });
            }
            requestAnimationFrame(detectionLoop); // 迴圈偵測
          }
          detectionLoop();
        };
      } catch (err) {
        statusMsg.innerText = "相機開啟失敗，請確認已允許權限！";
        console.error(err);
      }
    }

    // 頁面載入後自動啟動
    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
