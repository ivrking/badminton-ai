<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 羽球自學架拍偵測器 v10</title>
  
  <!-- 100% 複製 Danny 教練網站所使用的最穩定、絕不卡死的手機專用套件庫 -->
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    h1 { margin: 5px 0; font-size: 1.3rem; color: #4caf50; }
    #dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      background: #2a2a35;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .data-box { text-align: center; font-size: 0.9rem; }
    .data-box span { display: block; font-size: 1.5rem; font-weight: bold; color: #ffeb3b; }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }
    /* 【核心修正】絕對不隱藏 video！直接讓原生相機鋪底，避開 iOS 的安全封鎖機制 */
    #webcam {
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 鏡像翻轉 */
      display: block;
    }
    /* 畫布純粹用來疊加綠線，絕對不處理相機渲染 */
    #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 保持同步鏡像 */
      pointer-events: none; /* 讓點擊穿透 */
    }
    #status-msg {
      margin: 5px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #ff5722;
    }
  </style>
</head>
<body>

  <h1>🏸 AI 羽球自學架拍偵測器 v10</h1>
  
  <div id="dashboard">
    <div class="data-box">正確次數<span id="score-val">0</span></div>
    <div class="data-box">左肘角度<span id="left-angle">-°</span></div>
    <div class="data-box">右肘角度<span id="right-angle">-°</span></div>
  </div>

  <div id="status-msg">正在載入 AI 大腦...</div>

  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const scoreVal = document.getElementById('score-val');
    const leftAngleTxt = document.getElementById('left-angle');
    const rightAngleTxt = document.getElementById('right-angle');
    const statusMsg = document.getElementById('status-msg');

    let score = 0;
    let isCorrecting = false;
    let correctStartTime = null;
    const HOLD_TIME = 1000; 

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.3;
        window.speechSynthesis.speak(utterance);
      }
    }

    function calculateAngle(A, B, C) {
      const radians = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    function drawLine(pt1, pt2) {
      if (!pt1 || !pt2) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(pt1.x * canvasElement.width, pt1.y * canvasElement.height);
      canvasCtx.lineTo(pt2.x * canvasElement.width, pt2.y * canvasElement.height);
      canvasCtx.strokeStyle = '#00FF00';
      canvasCtx.lineWidth = 4;
      canvasCtx.stroke();
    }

    // 當 AI 成功抓到骨架時
    function onResults(results) {
      statusMsg.innerText = "請面向鏡頭舉手架拍";
      
      // 同步畫布與原生影片的尺寸（防位移）
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      // 每次清空畫布，只畫綠色的骨架線
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        
        // 撈出關鍵點 (11左肩, 12右肩, 13左肘, 14右肘, 15左腕, 16右腕)
        const leftShoulder = lm[11];
        const rightShoulder = lm[12];
        const leftElbow = lm[13];
        const rightElbow = lm[14];
        const leftWrist = lm[15];
        const rightWrist = lm[16];

        // 繪製骨架
        drawLine(leftShoulder, leftElbow);
        drawLine(leftElbow, leftWrist);
        drawLine(rightShoulder, rightElbow);
        drawLine(rightElbow, rightWrist);
        drawLine(leftShoulder, rightShoulder);

        if (leftShoulder && leftElbow && leftWrist && rightShoulder && rightElbow && rightWrist) {
          const leftAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
          const rightAngle = calculateAngle(rightShoulder, rightElbow, rightWrist);

          leftAngleTxt.innerText = leftAngle + "°";
          rightAngleTxt.innerText = rightAngle + "°";

          // 巢狀安全判斷結構
          if (leftAngle >= 70) {
            if (leftAngle <= 115) {
              if (rightAngle >= 70) {
                if (rightAngle <= 115) {
                  statusMsg.innerText = "姿勢正確！請維持住...";
                  statusMsg.style.color = "#4caf50";

                  if (isCorrecting === false) {
                    isCorrecting = true;
                    correctStartTime = Date.now();
                  } else {
                    if (Date.now() - correctStartTime >= HOLD_TIME) {
                      score = score + 1;
                      scoreVal.innerText = score;
                      speak("架拍正確");
                      isCorrecting = false;
                      correctStartTime = null;
                    }
                  }
                  return;
                }
              }
            }
          }
        }
      }
      isCorrecting = false;
      correctStartTime = null;
      statusMsg.style.color = "#ff5722";
    }

    // 【核心修正】使用與對方完全一致的 MediaPipe Pose 初始化參數
    const pose = new Pose({
      locateFile: (file) => `https://jsdelivr.net{file}`
    });

    pose.setOptions({
      modelComplexity: 0, // 0 速度最快，專為手機優化
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    pose.onResults(onResults);

    // 【核心修正】利用 MediaPipe 官方最穩定、能強制喚醒 iOS 原生鏡頭的 Camera 工具
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      }
    });

    // 啟動相機
    camera.start().then(() => {
      statusMsg.innerText = "相機已啟動，載入模型中...";
    }).catch(err => {
      statusMsg.innerText = "相機啟動失敗，請清除授權紀錄再試！";
      console.error(err);
    });
  </script>
</body>
</html>
