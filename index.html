<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 羽球自學架拍偵測器 v9</title>
  
  <!-- 改用極速獨立加載、不依賴外部大模型的 BlazePose 直導流套件 -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    h1 { margin: 5px 0; font-size: 1.3rem; color: #4caf50; }
    #dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      background: #2a2a35;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .data-box { text-align: center; font-size: 0.9rem; }
    .data-box span { display: block; font-size: 1.5rem; font-weight: bold; color: #ffeb3b; }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
    }
    #webcam { display: none; }
    #output_canvas {
      width: 100%;
      height: auto;
      transform: scaleX(-1);
      background-color: #111;
    }
    #status-msg {
      margin: 5px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #ff5722;
    }
  </style>
</head>
<body>

  <h1>🏸 AI 羽球自學架拍偵測器 v9</h1>
  
  <div id="dashboard">
    <div class="data-box">正確次數<span id="score-val">0</span></div>
    <div class="data-box">左肘角度<span id="left-angle">-°</span></div>
    <div class="data-box">右肘角度<span id="right-angle">-°</span></div>
  </div>

  <div id="status-msg">正在啟動相機串流...</div>

  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas" width="480" height="360"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const scoreVal = document.getElementById('score-val');
    const leftAngleTxt = document.getElementById('left-angle');
    const rightAngleTxt = document.getElementById('right-angle');
    const statusMsg = document.getElementById('status-msg');

    let score = 0;
    let isCorrecting = false;
    let correctStartTime = null;
    const HOLD_TIME = 1000; 
    let detector;

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.3;
        window.speechSynthesis.speak(utterance);
      }
    }

    function calculateAngle(A, B, C) {
      const radians = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    function drawLine(pt1, pt2) {
      if (!pt1 || !pt2) return;
      canvasCtx.beginPath();
      canvasCtx.moveTo(pt1.x, pt1.y);
      canvasCtx.lineTo(pt2.x, pt2.y);
      canvasCtx.strokeStyle = '#00FF00';
      canvasCtx.lineWidth = 4;
      canvasCtx.stroke();
    }

    async function detectionLoop() {
      if (videoElement.readyState >= 2 && detector) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

        // 呼叫極速 BlazePose 進行骨架提取
        const poses = await detector.estimatePoses(videoElement, { maxPoses: 1, flipHorizontal: false });

        if (poses && poses.length > 0) {
          statusMsg.innerText = "請面向鏡頭舉手架拍";
          const kp = poses[0].keypoints;
          
          // 建立快速索引對照表
          const lm = {};
          kp.forEach(point => {
            if (point.score > 0.3) {
              lm[point.name] = { x: point.x, y: point.y };
            }
          });

          // 繪製視覺化骨架
          drawLine(lm['left_shoulder'], lm['left_elbow']);
          drawLine(lm['left_elbow'], lm['left_wrist']);
          drawLine(lm['right_shoulder'], lm['right_elbow']);
          drawLine(lm['right_elbow'], lm['right_wrist']);
          drawLine(lm['left_shoulder'], lm['right_shoulder']);

          if (lm['left_shoulder'] && lm['left_elbow'] && lm['left_wrist'] &&
              lm['right_shoulder'] && lm['right_elbow'] && lm['right_wrist']) {
              
            const leftAngle = calculateAngle(lm['left_shoulder'], lm['left_elbow'], lm['left_wrist']);
            const rightAngle = calculateAngle(lm['right_shoulder'], lm['right_elbow'], lm['right_wrist']);

            leftAngleTxt.innerText = leftAngle + "°";
            rightAngleTxt.innerText = rightAngle + "°";

            // 巢狀安全判斷結構
            if (leftAngle >= 65) {
              if (leftAngle <= 120) {
                if (rightAngle >= 65) {
                  if (rightAngle <= 120) {
                    statusMsg.innerText = "姿勢正確！請維持住...";
                    statusMsg.style.color = "#4caf50";

                    if (isCorrecting === false) {
                      isCorrecting = true;
                      correctStartTime = Date.now();
                    } else {
                      if (Date.now() - correctStartTime >= HOLD_TIME) {
                        score = score + 1;
                        scoreVal.innerText = score;
                        speak("架拍正確");
                        isCorrecting = false;
                        correctStartTime = null;
                      }
                    }
                    canvasCtx.restore();
                    requestAnimationFrame(detectionLoop);
                    return;
                  }
                }
              }
            }
          }
        }
        canvasCtx.restore();
      }
      isCorrecting = false;
      correctStartTime = null;
      statusMsg.style.color = "#ff5722";
      requestAnimationFrame(detectionLoop);
    }

    async function main() {
      try {
        // 先強行將手機鏡頭打開，保證流暢度
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        videoElement.srcObject = stream;
        
        statusMsg.innerText = "相機已成功連線，正在啟動極速 AI...";

        // 載入完全不踩跨網域紅線的輕量化前端辨識引擎
        detector = await poseDetection.createDetector(
          poseDetection.SupportedModels.BlazePose,
          { runtime: 'mediapipe', modelType: 'lite', solutionPath: 'https://jsdelivr.net' }
        );

        videoElement.onloadedmetadata = () => {
          canvasElement.width = videoElement.videoWidth;
          canvasElement.height = videoElement.videoHeight;
          statusMsg.innerText = "系統已就緒！請向後退一步";
          detectionLoop();
        };
      } catch (err) {
        statusMsg.innerText = "啟動發生硬體衝突，請刷新頁面！";
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', main);
  </script>
</body>
</html>
