<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 羽球自學架拍偵測器</title>
  
  <!-- 引入 Google MediaPipe 姿態識別必備的 JS 檔案 -->
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    h1 { margin-bottom: 5px; font-size: 1.5rem; color: #4caf50; }
    #dashboard {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      background: #2a2a35;
      padding: 10px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .data-box { text-align: center; }
    .data-box span { display: block; font-size: 1.8rem; font-weight: bold; color: #ffeb3b; }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    /* 隱藏原始視訊標籤，因為我們要用畫布疊加骨架 */
    #webcam { display: none; }
    #output_canvas {
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 鏡像翻轉，讓畫面操作像照鏡子一樣自然 */
    }
    #status-msg {
      margin-top: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ff5722;
    }
  </style>
</head>
<body>

  <h1>🏸 AI 羽球自學架拍偵測器</h1>
  
  <!-- 狀態與數據看板 -->
  <div id="dashboard">
    <div class="data-box">正確次數<span id="score-val">0</span></div>
    <div class="data-box">左肘角度<span id="left-angle">-°</span></div>
    <div class="data-box">右肘角度<span id="right-angle">-°</span></div>
  </div>

  <div id="status-msg">鏡頭初始化中...請稍候</div>

  <!-- 影像與畫布容器 -->
  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const scoreVal = document.getElementById('score-val');
    const leftAngleTxt = document.getElementById('left-angle');
    const rightAngleTxt = document.getElementById('right-angle');
    const statusMsg = document.getElementById('status-msg');

    let score = 0;
    let isCorrecting = false;
    let correctStartTime = null;
    const HOLD_TIME = 1000; // 標準姿勢必須維持 1000 毫秒（1秒）

    // 瀏覽器文字轉語音函數
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 刪除前一個正在排隊的語音，避免延遲
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.2; // 說話速度稍微加快
        window.speechSynthesis.speak(utterance);
      }
    }

    // 計算三點組成的夾角 (A為端點，B為頂點/關節，C為端點)
    function calculateAngle(A, B, C) {
      const radians = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    // 當 MediaPipe 成功追蹤到骨架時的回呼函式
    function onResults(results) {
      statusMsg.innerText = "請面向鏡頭舉手架拍";
      
      // 清空並重新繪製畫布畫面
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // 1. 繪製骨架線段與節點
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
        drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#FF0000', lineWidth: 2, radius: 4 });

        // 2. 撈出關鍵關節點的座標
        const leftShoulder = results.poseLandmarks[11];
        const rightShoulder = results.poseLandmarks[12];
        const leftElbow = results.poseLandmarks[13];
        const rightElbow = results.poseLandmarks[14];
        const leftWrist = results.poseLandmarks[15];
        const rightWrist = results.poseLandmarks[16];

        // 3. 計算左右手肘夾角
        const leftAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
        const rightAngle = calculateAngle(rightShoulder, rightElbow, rightWrist);

        // 更新網頁上的角度文字
        leftAngleTxt.innerText = leftAngle + "°";
        rightAngleTxt.innerText = rightAngle + "°";

        // 4. 定義正手架拍的標準範圍 (手肘夾角建議在 75° ~ 110° 之間)
        const isLeftValid = (leftAngle >= 75 && leftAngle <= 110);
        const isRightValid = (rightAngle >= 75 && rightAngle <= 110);

        // 這裡以右手持拍為例（你可以根據需求修改為雙手或是單邊滿足）
        if (isRightValid && isLeftValid) {
          statusMsg.innerText = "姿勢正確！請維持住...";
          statusMsg.style.color = "#4caf50";

          if (!isCorrecting) {
            isCorrecting = true;
            correctStartTime = Date.now(); // 記錄開始正確的時間點
          } else {
            // 計算目前已經維持了多久
            const duration = Date.now() - correctStartTime;
            if (duration >= HOLD_TIME) {
              score++;
              scoreVal.innerText = score;
              speak("架拍正確"); // 觸發語音播報
              
              // 判定成功後重置定時器，強迫使用者必須放下再重新做一次，或重新定格
              isCorrecting = false; 
              correctStartTime = null;
            }
          }
        } else {
          // 姿勢不對，立刻重置計時
          isCorrecting = false;
          correctStartTime = null;
          statusMsg.style.color = "#ff5722";
        }
      }
      canvasCtx.restore();
    }

    // 初始化 MediaPipe Pose 模型
    const pose = new Pose({
      locateFile: (file) => `https://jsdelivr.net{file}`
    });

    pose.setOptions({
      modelComplexity: 1,      // 1 兼顧速度與準確度，適合手機
      smoothLandmarks: true,
      enableSegmentation: false,
      smoothSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    // 啟動相機並持續將影格送給 AI 模型處理
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    
    camera.start().catch(err => {
      statusMsg.innerText = "無法開啟相機，請確認已授權權限！";
      console.error(err);
    });
  </script>
</body>
</html>
