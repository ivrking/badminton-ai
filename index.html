<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 羽球自學架拍偵測器 v8</title>
  
  <!-- 引入最標準、絕不與 iOS 核心衝突的 P5 & ML5 基礎視覺庫 -->
  <script src="https://cloudflare.com"></script>
  <script src="https://unpkg.com"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    h1 { margin: 5px 0; font-size: 1.3rem; color: #4caf50; }
    #dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      background: #2a2a35;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .data-box { text-align: center; font-size: 0.9rem; }
    .data-box span { display: block; font-size: 1.5rem; font-weight: bold; color: #ffeb3b; }
    #canvas-holder {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    #status-msg {
      margin: 5px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #ff5722;
    }
  </style>
</head>
<body>

  <h1>🏸 AI 羽球自學架拍偵測器 v8</h1>
  
  <div id="dashboard">
    <div class="data-box">正確次數<span id="score-val">0</span></div>
    <div class="data-box">左肘角度<span id="left-angle">-°</span></div>
    <div class="data-box">右肘角度<span id="right-angle">-°</span></div>
  </div>

  <div id="status-msg">正在啟動鏡頭與 AI 大腦...</div>

  <!-- p5.js 會自動把畫面渲染到這個容器裡 -->
  <div id="canvas-holder"></div>

  <script>
    let video;
    let poseNet;
    let poses = [];
    
    let score = 0;
    let isCorrecting = false;
    let correctStartTime = null;
    const HOLD_TIME = 1000;

    const scoreVal = document.getElementById('score-val');
    const leftAngleTxt = document.getElementById('left-angle');
    const rightAngleTxt = document.getElementById('right-angle');
    const statusMsg = document.getElementById('status-msg');

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.3;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 計算角度
    function calculateAngle(A, B, C) {
      let radians = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) {
        angle = 360 - angle;
      }
      return Math.round(angle);
    }

    // p5.js 核心初始化
    function setup() {
      // 建立適合手機的畫布尺寸
      const canvas = createCanvas(480, 360);
      canvas.parent('canvas-holder');
      
      // 呼叫手機原生物件，100% 觸發相機彈窗
      video = createCapture(VIDEO);
      video.size(480, 360);
      video.hide(); // 隱藏原生標籤，我們用畫布畫

      statusMsg.innerText = "相機已啟動，正在下載骨架模型...";

      // 初始化最不容易崩潰的 PoseNet 模型
      poseNet = ml5.poseNet(video, modelLoaded);
      poseNet.on('pose', function(results) {
        poses = results;
      });
    }

    function modelLoaded() {
      statusMsg.innerText = "模型載入成功！請面向鏡頭架拍";
    }

    // p5.js 影格自動刷新迴圈（每秒執行 30-60 次）
    function draw() {
      // 畫出水平翻轉的鏡像畫面，照鏡子比較自然
      translate(width, 0);
      scale(-1, 1);
      image(video, 0, 0, width, height);
      
      // 恢復正常座標系，方便畫骨架跟計算
      scale(-1, 1);
      translate(-width, 0);

      if (poses.length > 0) {
        let pose = poses[0].pose;
        
        // 撈出關鍵點
        let leftShoulder = pose.leftShoulder;
        let leftElbow = pose.leftElbow;
        let leftWrist = pose.leftWrist;
        let rightShoulder = pose.rightShoulder;
        let rightElbow = pose.rightElbow;
        let rightWrist = pose.rightWrist;

        // 確保關鍵點都有被辨識到（信心分數大於 0.2）
        if (leftShoulder.confidence > 0.2 && leftElbow.confidence > 0.2 && leftWrist.confidence > 0.2 &&
            rightShoulder.confidence > 0.2 && rightElbow.confidence > 0.2 && rightWrist.confidence > 0.2) {
          
          // 在畫布上繪製骨架骨骼線（因為做了鏡像，X座標要反轉）
          stroke(0, 255, 0);
          strokeWeight(4);
          line(width - leftShoulder.x, leftShoulder.y, width - leftElbow.x, leftElbow.y);
          line(width - leftElbow.x, leftElbow.y, width - leftWrist.x, leftWrist.y);
          line(width - rightShoulder.x, rightShoulder.y, width - rightElbow.x, rightElbow.y);
          line(width - rightElbow.x, rightElbow.y, width - rightWrist.x, rightWrist.y);
          line(width - leftShoulder.x, leftShoulder.y, width - rightShoulder.x, rightShoulder.y);

          // 計算夾角
          let leftAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
          let rightAngle = calculateAngle(rightShoulder, rightElbow, rightWrist);

          leftAngleTxt.innerText = leftAngle + "°";
          rightAngleTxt.innerText = rightAngle + "°";

          // 【修正】使用巢狀 if 語句，徹底消滅會讓網頁崩潰的特殊符號
          if (leftAngle >= 65) {
            if (leftAngle <= 120) {
              if (rightAngle >= 65) {
                if (rightAngle <= 120) {
                  
                  statusMsg.innerText = "姿勢正確！請維持住...";
                  statusMsg.style.color = "#4caf50";

                  if (isCorrecting === false) {
                    isCorrecting = true;
                    correctStartTime = Date.now();
                  } else {
                    if (Date.now() - correctStartTime >= HOLD_TIME) {
                      score = score + 1;
                      scoreVal.innerText = score;
                      speak("架拍正確");
                      isCorrecting = false;
                      correctStartTime = null;
                    }
                  }
                  return; // 成功符合直接跳出，不執行下面的重置
                }
              }
            }
          }
        }
      }
      
      // 若上述任何一關沒通過，重置計時器
      isCorrecting = false;
      correctStartTime = null;
      statusMsg.style.color = "#ff5722";
    }
  </script>
</body>
</html>
