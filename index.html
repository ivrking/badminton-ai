<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 羽球自學架拍偵測器 v12</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    h1 { margin: 5px 0; font-size: 1.3rem; color: #4caf50; }
    #dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      background: #2a2a35;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .data-box { text-align: center; font-size: 0.9rem; }
    .data-box span { display: block; font-size: 1.5rem; font-weight: bold; color: #ffeb3b; }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
      background-color: #111;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    /* 【終極修正】強制顯示原生視訊，絕不隱藏！打破所有黑屏魔咒 */
    #webcam {
      width: 100%;
      height: auto;
      transform: scaleX(-1);
      display: block;
    }
    #status-msg {
      margin: 5px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #4caf50;
    }
  </style>
</head>
<body>

  <h1>🏸 AI 羽球自學架拍偵測器 v12</h1>
  
  <div id="dashboard">
    <div class="data-box">正確次數<span id="score-val">0</span></div>
    <div class="data-box">左肘角度<span id="left-angle">90°</span></div>
    <div class="data-box">右肘角度<span id="right-angle">90°</span></div>
  </div>

  <div id="status-msg">正在啟動原生相機...</div>

  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const scoreVal = document.getElementById('score-val');
    const statusMsg = document.getElementById('status-msg');

    let score = 0;

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.3;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 完全不使用任何外部 AI 套件，純粹啟動手機硬體串流
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        videoElement.srcObject = stream;
        
        videoElement.onloadedmetadata = () => {
          statusMsg.innerText = "⚡ 鏡頭已接通！請舉手架拍 ⚡";
          
          // 模擬定時語音測試，確保發聲元件正常
          setTimeout(() => {
            speak("相機已就緒");
          }, 1000);
        };
      } catch (err) {
        statusMsg.innerText = "鏡頭開不起來，請重新整理網頁！";
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
